<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffe6e6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            position: relative;
        }
        h1 {
            color: #ff4d4d;
            font-size: 1.5rem;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .yes {
            background-color: #ff4d4d;
            color: white;
            position: relative;
            z-index: 10;
        }
        .no {
            background-color: #ccc;
            color: black;
            position: absolute;
        }
        .label {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ff4d4d;
        }
        @media (max-width: 600px) {
            .buttons {
                flex-direction: column;
                gap: 10px;
            }
            button {
                font-size: 16px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will you be my Valentine? 💖</h1>
        <div class="buttons">
            <button id="yes" class="yes">Yes</button>
            <button id="no" class="no">No</button>
        </div>
        <div class="label"></div>
    </div>
    <script>
        $(document).ready(function () {
            var yesButton = $("#yes");
            var noButton = $("#no");
            var container = $(".container");
            
            var initialX = yesButton.position().left;
            var initialY = yesButton.position().top;
            var moveRadius = 50; // No button moves within this radius around Yes button
            
            noButton.css({ top: initialY, left: initialX + 80 });

            noButton.mouseover(function () {
                var newTop = initialY + getRandomIntInclusive(-moveRadius, moveRadius);
                var newLeft = initialX + getRandomIntInclusive(-moveRadius, moveRadius);

                // Ensure the button stays inside the container
                var containerWidth = container.width() - noButton.width();
                var containerHeight = container.height() - noButton.height();

                newLeft = Math.max(0, Math.min(containerWidth, newLeft));
                newTop = Math.max(0, Math.min(containerHeight, newTop));

                noButton.css({ top: newTop, left: newLeft, position: "absolute" });
            });

            yesButton.click(function () {
                $(".label").replaceWith("<div class='label'>I knew it :3</div>");
                yesButton.hide();
                noButton.hide();
            });
        });

        function getRandomIntInclusive(min, max) {
            min = Math.ceil(min);
            max = Math.floor(max);
            return Math.floor(Math.random() * (max - min + 1) + min);
        }
    </script>
</body>
</html>
