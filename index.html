<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffe6e6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            position: relative;
        }
        h1 {
            color: #ff4d4d;
            font-size: 1.5rem;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .yes {
            background-color: #ff4d4d;
            color: white;
            position: relative;
            z-index: 10;
        }
        .no {
            background-color: #ccc;
            color: black;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will you be my Valentine? 💖</h1>
        <div class="buttons">
            <button class="yes" onclick="showLove()">Yes</button>
            <button class="no" onmouseover="moveNoButton()">No</button>
        </div>
    </div>
    <script>
        function showLove() {
            alert("Yay! You made my day! ❤️🥰");
        }
        function moveNoButton() {
            const yesButton = document.querySelector(".yes");
            const noButton = document.querySelector(".no");
            
            const yesRect = yesButton.getBoundingClientRect();
            const radius = 150; // Movement radius around Yes button
            
            let angle = Math.random() * 2 * Math.PI;
            let x = yesRect.left + yesRect.width / 2 + radius * Math.cos(angle);
            let y = yesRect.top + yesRect.height / 2 + radius * Math.sin(angle);
            
            // Ensure button stays within the window boundaries
            const maxX = window.innerWidth - noButton.offsetWidth - 10;
            const maxY = window.innerHeight - noButton.offsetHeight - 10;
            
            if (x < 10) x = 10;
            if (y < 10) y = 10;
            if (x > maxX) x = maxX;
            if (y > maxY) y = maxY;
            
            noButton.style.position = "absolute";
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        }
    </script>
</body>
</html>
